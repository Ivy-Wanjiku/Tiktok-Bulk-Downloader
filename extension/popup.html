<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        
        h2 {
            margin: 0 0 15px 0;
            color: #667eea;
            font-size: 18px;
        }
        
        .status {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .status.idle {
            background: #f0f0f0;
            color: #666;
        }
        
        .status.scrolling {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .stats {
            margin-bottom: 15px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .stat-label {
            color: #666;
            font-size: 13px;
        }
        
        .stat-value {
            font-weight: 600;
            color: #333;
            font-size: 13px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.3s;
        }
        
        button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button.secondary {
            background: #f44336;
            color: white;
        }
        
        button.secondary:hover {
            background: #d32f2f;
        }
        
        button.success {
            background: #4caf50;
            color: white;
        }
        
        button.success:hover {
            background: #45a049;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .message {
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .settings {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .setting-item {
            margin-bottom: 10px;
        }
        
        .setting-item label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .setting-item input[type="number"] {
            width: 100%;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .demo-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #fff3cd;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
        }
        
        .demo-toggle label {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #856404;
            font-weight: 600;
        }
        
        .demo-toggle input[type="checkbox"] {
            margin-left: 8px;
            cursor: pointer;
        }
        
        .demo-info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 11px;
            color: #0c5460;
            display: none;
        }
        
        .setup-guide-btn {
            background: #17a2b8;
            color: white;
            font-size: 12px;
            padding: 8px;
            margin-bottom: 10px;
        }
        
        .setup-guide-btn:hover {
            background: #138496;
        }
    </style>
</head>
<body>
    <h2>🎵 TikTok Bulk Downloader</h2>
    
    <button id="setupGuideBtn" class="setup-guide-btn">📖 Setup Guide for Reviewers</button>
    
    <div class="demo-toggle">
        <label>
            🎭 Demo Mode (Test without backend)
            <input type="checkbox" id="demoModeToggle">
        </label>
    </div>
    
    <div id="demoInfo" class="demo-info">
        ℹ️ Demo mode enabled: Extension will simulate functionality without requiring a backend server. Perfect for testing!
    </div>
    
    <div id="status" class="status idle">
        <strong>Status:</strong> <span id="statusText">Idle</span>
    </div>
    
    <div class="stats">
        <div class="stat-item">
            <span class="stat-label">URLs Collected</span>
            <span class="stat-value" id="urlCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Scroll Count</span>
            <span class="stat-value" id="scrollCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">API Status</span>
            <span class="stat-value" id="apiStatus">Checking...</span>
        </div>
    </div>
    
    <button id="startBtn" class="primary">🚀 Start Auto-Scroll</button>
    <button id="stopBtn" class="secondary" style="display: none;">⏹️ Stop Scrolling</button>
    <button id="downloadBtn" class="success" style="display: none;">📥 Download Videos</button>
    <button id="clearBtn" style="background: #999; color: white;">🗑️ Clear URLs</button>
    
    <div id="message" class="message"></div>
    
    <div class="settings">
        <div class="setting-item">
            <label>Scroll Interval (ms)</label>
            <input type="number" id="scrollInterval" value="2000" min="500" max="10000" step="100">
        </div>
        <div class="setting-item">
            <label>API URL</label>
            <input type="text" id="apiUrl" value="http://localhost:3000" style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
