<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Bulk Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2ea;
            --primary-dark: #00d4cd;
            --secondary: #ff0050;
            --accent: #fe2c55;
            --dark: #121212;
            --dark-card: #1e1e1e;
            --dark-hover: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --success: #00f593;
            --warning: #ffa500;
            --error: #ff4757;
            --border: #2d2d2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 242, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 80, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(254, 44, 85, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            margin-bottom: 40px;
            position: relative;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .logo-icon {
            font-size: 4em;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        header h1 {
            font-size: 3.5em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        header p {
            font-size: 1.2em;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Toast Messages */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            max-width: 400px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .message.success {
            background: rgba(0, 245, 147, 0.15);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .message.error {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .message.show {
            display: flex;
        }

        .message i {
            font-size: 1.2em;
        }

        /* Card Styles */
        .card {
            background: var(--dark-card);
            border-radius: 24px;
            padding: 0;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 48px rgba(0,0,0,0.4);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            background: var(--dark);
            padding: 8px;
            border-radius: 16px 16px 0 0;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 16px 24px;
            background: transparent;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab:hover {
            background: var(--dark-hover);
            color: var(--text-primary);
        }

        .tab.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 242, 234, 0.3);
        }

        .tab-content {
            display: none;
            padding: 32px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-content.active {
            display: block;
        }

        .tab-content h2 {
            color: var(--primary);
            margin-bottom: 24px;
            font-size: 1.8em;
            font-weight: 700;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label i {
            color: var(--primary);
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 16px 20px;
            background: var(--dark);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-primary);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 242, 234, 0.1);
            background: rgba(0, 242, 234, 0.05);
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: var(--text-secondary);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
            font-family: 'Monaco', 'Menlo', monospace;
            line-height: 1.6;
        }

        /* Buttons */
        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--dark);
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 242, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 234, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background: var(--dark-hover);
            color: var(--text-primary);
            box-shadow: none;
        }

        button.secondary:hover {
            background: var(--border);
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button-group button {
            flex: 1;
            min-width: 150px;
        }

        /* Job Items */
        .jobs-list {
            display: grid;
            gap: 20px;
        }

        .job-item {
            background: var(--dark);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .job-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary) 0%, var(--secondary) 100%);
        }

        .job-item:hover {
            border-color: var(--primary);
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(0, 242, 234, 0.2);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 16px;
        }

        .job-title-section {
            flex: 1;
        }

        .job-name {
            font-weight: 700;
            font-size: 1.2em;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .job-name i {
            color: var(--primary);
            font-size: 0.9em;
        }

        .job-meta {
            color: var(--text-secondary);
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .job-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .job-status i {
            font-size: 0.9em;
        }

        .status-pending {
            background: rgba(255, 165, 0, 0.15);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .status-downloading {
            background: rgba(0, 245, 147, 0.15);
            color: var(--success);
            border: 1px solid var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .status-paused {
            background: rgba(255, 165, 0, 0.15);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .status-stopped {
            background: rgba(176, 176, 176, 0.15);
            color: var(--text-secondary);
            border: 1px solid var(--text-secondary);
        }

        .status-completed {
            background: rgba(0, 245, 147, 0.15);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-failed {
            background: rgba(255, 71, 87, 0.15);
            color: var(--error);
            border: 1px solid var(--error);
        }

        /* Progress Bar */
        .job-progress {
            margin: 16px 0;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: var(--dark-card);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        /* Job Stats */
        .job-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 16px 0;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--dark-card);
            border-radius: 8px;
            font-size: 0.9em;
            border: 1px solid var(--border);
        }

        .stat-item i {
            font-size: 1.1em;
        }

        .stat-item.success i {
            color: var(--success);
        }

        .stat-item.error i {
            color: var(--error);
        }

        .stat-item.warning i {
            color: var(--warning);
        }

        .stat-item.info i {
            color: var(--primary);
        }

        /* Job Controls */
        .job-controls {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .btn-control {
            padding: 10px 20px;
            font-size: 0.9em;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .btn-control:hover {
            transform: translateY(-2px);
        }

        .btn-control:active {
            transform: translateY(0);
        }

        .btn-pause {
            background: rgba(255, 165, 0, 0.15);
            color: var(--warning);
            border-color: var(--warning);
        }

        .btn-pause:hover {
            background: var(--warning);
            color: var(--dark);
        }

        .btn-resume {
            background: rgba(0, 245, 147, 0.15);
            color: var(--success);
            border-color: var(--success);
        }

        .btn-resume:hover {
            background: var(--success);
            color: var(--dark);
        }

        .btn-stop {
            background: rgba(255, 71, 87, 0.15);
            color: var(--error);
            border-color: var(--error);
        }

        .btn-stop:hover {
            background: var(--error);
            color: white;
        }

        .job-path {
            margin-top: 12px;
            padding: 10px 14px;
            background: var(--dark-card);
            border-radius: 8px;
            font-size: 0.85em;
            color: var(--text-secondary);
            font-family: 'Monaco', monospace;
            border: 1px solid var(--border);
            word-break: break-all;
        }

        /* Loading & Empty States */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid var(--dark-hover);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 5em;
            margin-bottom: 20px;
            opacity: 0.3;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .empty-state h3 {
            color: var(--text-primary);
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1em;
            margin-bottom: 24px;
        }

        /* Preview Section */
        .preview-section {
            margin-top: 24px;
            padding: 24px;
            background: var(--dark);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .preview-section h3 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--dark-card);
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .preview-count {
            font-size: 2em;
            font-weight: 700;
            color: var(--primary);
        }

        .video-list {
            max-height: 400px;
            overflow-y: auto;
            background: var(--dark-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .video-list::-webkit-scrollbar {
            width: 8px;
        }

        .video-list::-webkit-scrollbar-track {
            background: var(--dark);
        }

        .video-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .video-list::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .video-item {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .video-item:last-child {
            border-bottom: none;
        }

        .video-item:hover {
            background: var(--dark-hover);
        }

        .video-number {
            font-weight: 700;
            color: var(--primary);
            min-width: 35px;
        }

        .video-title {
            flex: 1;
            color: var(--text-primary);
        }

        .video-views {
            color: var(--text-secondary);
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Divider */
        .divider {
            text-align: center;
            margin: 32px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: var(--border);
        }

        .divider-text {
            background: var(--dark-card);
            padding: 0 20px;
            position: relative;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.5em;
            }

            .card {
                border-radius: 16px;
            }

            .tab-content {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group button {
                width: 100%;
            }

            .job-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .job-stats {
                flex-direction: column;
                gap: 10px;
            }

            .job-controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <i class="fa-brands fa-tiktok logo-icon"></i>
            </div>
            <h1>TikTok Bulk Downloader</h1>
            <p>Download TikTok videos effortlessly with modern UI & real-time tracking</p>
        </header>

        <div id="message" class="message"></div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('download')">
                    <i class="fas fa-download"></i> Download
                </button>
                <button class="tab" onclick="switchTab('jobs')">
                    <i class="fas fa-list-check"></i> Jobs
                </button>
            </div>

            <div id="download-tab" class="tab-content active">
                <h2><i class="fas fa-cloud-download-alt"></i> Download Videos</h2>
                
                <div class="form-group">
                    <label><i class="fas fa-user"></i> TikTok Username</label>
                    <input type="text" id="username" placeholder="Enter username (e.g., @username or username)">
                    <div class="button-group" style="margin-top: 14px;">
                        <button onclick="previewUser()" class="secondary">
                            <i class="fas fa-search"></i> Preview Videos
                        </button>
                        <button onclick="downloadFromUser()">
                            <i class="fas fa-download"></i> Download All
                        </button>
                    </div>
                </div>

                <div id="previewSection" class="preview-section" style="display: none;">
                    <h3><i class="fas fa-eye"></i> Preview Results</h3>
                    <div id="previewContent"></div>
                </div>

                <div class="divider">
                    <span class="divider-text">OR</span>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-link"></i> Video URLs (one per line)</label>
                    <textarea id="urls" placeholder="https://www.tiktok.com/@user/video/123...&#10;https://www.tiktok.com/@user/video/456...&#10;https://www.tiktok.com/@user/video/789..."></textarea>
                    <button onclick="downloadFromUrls()" style="margin-top: 14px; width: 100%;">
                        <i class="fas fa-download"></i> Download Videos
                    </button>
                </div>
            </div>

            <div id="jobs-tab" class="tab-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
                    <h2 style="margin: 0;"><i class="fas fa-tasks"></i> Download Jobs</h2>
                    <button onclick="loadJobs()" class="secondary">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
                <div id="jobs-list"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
